<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tacstem" />
    <meta name="description" content="OWNED BY VISHNU P V" />
    <meta property="og:title" content="Remix  Tacstem App Pro 10" />
    <meta property="og:description" content="OWNED BY VISHNU P V" />
    <title>Remix  Tacstem App Pro 10</title>
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        font-family: 'IBM Plex Sans', sans-serif !important;
      }
      body {
        background-color: #0f0f0f;
        color: #ffffff;
        overflow: hidden;
      }
      .select-none,
      .select-none *:not(input):not(textarea):not([contenteditable="true"]):not(.select-text) {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      .select-text,
      .select-text * {
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        -ms-user-select: text !important;
        user-select: text !important;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      .btn-glow {
        position: relative;
        transition: all 0.2s ease;
        background: #c6ff1f;
        color: #0a0a0c;
        font-weight: 600;
      }
      .btn-glow:hover {
        background: #d4ff4d;
        box-shadow: 0 0 25px rgba(198, 255, 31, 0.35);
        transform: translateY(-1px);
      }
      .btn-glow:active {
        transform: scale(0.98);
      }
      .scrollbar-glass {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }
      .scrollbar-glass::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      .scrollbar-glass::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-glass::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      .scrollbar-glass::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .scrollbar-panel {
        scrollbar-width: thin;
        scrollbar-color: #334155 transparent;
      }
      .scrollbar-panel::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      .scrollbar-panel::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-panel::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
        border: 4px solid #0e1422;
        background-clip: padding-box;
      }
      .scrollbar-panel::-webkit-scrollbar-thumb:hover {
        background: #475569;
        border: 4px solid #0e1422;
        background-clip: padding-box;
      }
      .scrollbar-pitch::-webkit-scrollbar-thumb {
        border-color: #22c55e;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
